name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Set up pinned frontend and documentation runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Prepare independent locked environments
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py prepare
      - name: Check source and tooling regressions
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py check
      - name: Prepare real frontend and Chromium
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py frontend
      - name: Test both applications and responsive shell
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py test
      - name: Validate approved Windows compiler diagnostic
        id: compiler_diagnostic
        if: failure() && runner.os == 'Windows'
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py diagnostics
      - name: Retain approved compiler-only diagnostic for one day
        if: failure() && runner.os == 'Windows' && steps.compiler_diagnostic.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-editor-compiler-${{ github.run_id }}
          path: code/tools/test-results/diagnostics/editor-build.log
          retention-days: 1
          include-hidden-files: false
          if-no-files-found: error
      - name: Prove starter assertion failure and restoration
        run: uv run --project code/tools --locked python code/tools/scripts/verify_failure_gate.py
      - name: Validate documentation and render Mermaid
        run: uv run --project code/tools --locked python code/tools/scripts/verify_docs.py
      - name: Audit hashed Python and resolved frontend dependencies
        run: uv run --project code/tools --locked python code/tools/scripts/audit_dependencies.py

  images:
    name: Linux image health and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Set up pinned frontend and documentation runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Prepare locked test environments
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py prepare
      - name: Prepare frontend and browser tools
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py frontend
      - name: Build and exercise actual images
        run: uv run --project code/tools --locked python code/tools/scripts/test_images.py
      - name: Audit dependencies and actual runtime/build images
        run: uv run --project code/tools --locked python code/tools/scripts/audit_dependencies.py --images
