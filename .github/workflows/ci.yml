name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: "code/*/uv.lock"
      - name: Set up pinned frontend and documentation runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Prepare independent locked environments
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py prepare
      - name: Check source and tooling regressions
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py check
      - name: Prepare real frontend and Chromium
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py frontend
      - name: Test both applications and responsive shell
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py test
      - name: Prove starter assertion failure and restoration
        run: uv run --project code/tools --locked python code/tools/scripts/verify_failure_gate.py
      - name: Validate documentation and render Mermaid
        run: uv run --project code/tools --locked python code/tools/scripts/verify_docs.py
      - name: Audit hashed Python and resolved frontend dependencies
        run: uv run --project code/tools --locked python code/tools/scripts/audit_dependencies.py

  images:
    name: Linux image health and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: "code/*/uv.lock"
      - name: Set up pinned frontend and documentation runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Prepare locked test environments
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py prepare
      - name: Prepare frontend and browser tools
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py frontend
      - name: Build and exercise actual images
        run: uv run --project code/tools --locked python code/tools/scripts/test_images.py
      - name: Audit dependencies and actual runtime/build images
        run: uv run --project code/tools --locked python code/tools/scripts/audit_dependencies.py --images

  terraform:
    name: Terraform tests, structure and security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: "code/*/uv.lock"
      - name: Set up pinned frontend and documentation runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Prepare locked tooling environment and the pinned credential-free Terraform
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py prepare
      - name: Validate environment files
        run: uv run --project code/tools --locked python code/tools/scripts/validate_environment.py
      - name: Validate the Terraform layout
        run: uv run --project code/tools --locked python code/tools/scripts/check_terraform_structure.py
      - name: Run fmt, validate, native tests and the Trivy configuration scan for every root and module
        run: uv run --project code/tools --locked python code/tools/scripts/verify_terraform.py check
      - name: Run the Pester tests of the identity script
        run: uv run --project code/tools --locked python code/tools/scripts/run_pester.py

  e2e:
    name: In-process end-to-end journey
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: "code/*/uv.lock"
      - name: Set up pinned frontend and documentation runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - name: Prepare locked environments
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py prepare
      - name: Run the journey of both live applications with fake ports
        run: uv run --project code/tools --locked python code/tools/scripts/ci.py e2e