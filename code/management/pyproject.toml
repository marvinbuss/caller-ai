[project]
name = "caller-management"
version = "0.1.0"
description = "Reflex management foundation for Caller AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "reflex==0.10.0",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "websockets>=16.1,<17",
  "azure-cosmos>=4.9,<5",
  "azure-identity>=1.21,<2",
  "jsonschema>=4.23,<5",
  "PyJWT[crypto]>=2.15,<3",
  "msal>=1.39,<2",
  "mcp>=1.20,<2",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "aiohttp>=3.12,<4",
  "granian>=2.8,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-socket>=0.7,<1",
  "pytest-playwright>=0.7,<1",
  "psutil>=7,<8",
  "jsonschema>=4.23,<5",
  "types-jsonschema>=4.23",
  "mypy>=1.15,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["management_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
markers = [
  "browser: requires prepared Chromium and local application processes",
  "quick: fast unit and contract tests with no process, browser or build setup",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["management_app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
