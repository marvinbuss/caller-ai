[project]
name = "caller-e2e"
version = "0.1.0"
description = "In-process end-to-end journey of the live runtime and management apps with fake ports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "caller-runtime",
  "caller-management",
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
]

[tool.uv]
package = false
default-groups = []

[tool.uv.sources]
caller-runtime = { path = "../backend" }
caller-management = { path = "../management" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
