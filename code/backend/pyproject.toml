[project]
name = "caller-runtime"
version = "0.1.0"
description = "Credential-free foundation for the Caller AI call runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "azure-cosmos>=4.9,<5",
  "azure-identity>=1.21,<2",
  "PyJWT[crypto]>=2.15,<3",
  "jsonschema>=4.23,<5",
  "openai-agents>=0.6,<1",
  "openai>=3.31,<4",
  "websockets>=15,<17",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]

[dependency-groups]
dev = [
  "psutil>=7,<8",
  "pytest>=8.3,<10",
  "pytest-socket>=0.7,<1",
  "types-jsonschema>=4.23",
  "mypy>=1.15,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caller_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib --disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
markers = ["quick: fast unit and contract tests with no process, browser or build setup"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
